<div class="site-footer">
  <div class="site-footer-item" id="site-running-time"></div>
  <div class="site-footer-item">
    Copyright© {{ (time.AsTime .Site.Params.siteStartDate).Format "2006" }}-{{ now.Format "2006" }} Zhang Yang's Blog
  </div>
  <div class="site-footer-item">
    Powered by
    <a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a>
    &&
    <a href="https://github.com/joway/hugo-theme-yinyang" target="_blank" rel="noopener">hugo-theme-yinyang</a>
    &&
    <a href="https://www.cloudflare.com/zh-cn/" target="_blank" rel="noopener">CloudFlare</a>
  </div>
</div>

<script>
  function updateRunningTime() {
    const startDate = new Date("{{ .Site.Params.siteStartDate }}");
    const now = new Date();
    let diffMs = now - startDate; // 毫秒差

    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    diffMs %= (1000 * 60 * 60 * 24);
    const hours = Math.floor(diffMs / (1000 * 60 * 60));
    diffMs %= (1000 * 60 * 60);
    const minutes = Math.floor(diffMs / (1000 * 60));
    diffMs %= (1000 * 60);
    const seconds = Math.floor(diffMs / 1000);

    document.getElementById("site-running-time").textContent =
      `站点运行时间：${days} 天 ${hours} 时 ${minutes} 分 ${seconds} 秒`;
  }

  // 初始加载时更新
  updateRunningTime();
  // 每秒更新一次
  setInterval(updateRunningTime, 1000);

  // 主题切换（View Transitions API + circle-blur-top-left）
  const themeToggle = document.getElementById('theme-toggle');
  if (themeToggle) {
    const themeIcon = themeToggle.querySelector('i');
    let switching = false;

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (themeIcon) {
        themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
      }
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      setTheme(savedTheme || 'light');
    }

    themeToggle.addEventListener('click', (e) => {
      e.preventDefault();
      if (switching) return;
      switching = true;

      const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      const root = document.documentElement;

      if (!document.startViewTransition) {
        setTheme(newTheme);
        switching = false;
        return;
      }

      const transition = document.startViewTransition(() => {
        root.classList.toggle('dark', newTheme === 'dark');
        setTheme(newTheme);
      });
      transition.finished.then(() => { switching = false; });
    });

    initTheme();
  }

  // 复制代码按钮
  (function () {
    var lineNumberRegex = /^\s*\d+\s*/;
    var preList = document.querySelectorAll('.markdown-body pre');
    preList.forEach(function (pre) {
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () {
        var codeBlock = pre.querySelector('code');
        var text = codeBlock ? codeBlock.textContent : pre.textContent;
        var cleaned = text.split('\n').map(function (line) {
          return line.replace(lineNumberRegex, '');
        }).join('\n');
        navigator.clipboard.writeText(cleaned).then(function () {
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = 'Copy'; }, 2000);
        });
      });
      pre.appendChild(btn);
    });
  })();
</script>
